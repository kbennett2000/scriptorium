[project]
name = "scriptorium"
version = "0.1.0"
description = "Scriptorium bakery orchestrator, library, sync, and admin API (i5 server)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic>=2",
    "jsonschema",
    "jinja2",
    "pillow",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "respx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scriptorium"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# GPU/network tests are opt-in: run them with `-m gpu` / `-m network` (a CLI -m
# overrides this default expression). The default suite stays offline & GPU-less.
addopts = "-m 'not gpu and not network'"
markers = [
    "gpu: tests that require a live GPU service (skipped by default).",
    "network: tests that require live network access (skipped by default).",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
