<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Scriptorium — turn any book into an illuminated, offline library, baked at home">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1440"/>
      <stop offset="0.55" stop-color="#241a52"/>
      <stop offset="1" stop-color="#3a1f4d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d98a"/>
      <stop offset="0.5" stop-color="#e8b64c"/>
      <stop offset="1" stop-color="#c9962b"/>
    </linearGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf3df"/>
      <stop offset="1" stop-color="#f0e2bd"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6d98a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f6d98a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground -->
  <rect width="1200" height="320" fill="url(#ink)"/>
  <rect x="8" y="8" width="1184" height="304" rx="14" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.55"/>

  <!-- faint scattered stars / gilt flecks -->
  <g fill="#f6d98a" opacity="0.5">
    <circle cx="640" cy="46" r="1.6"/><circle cx="712" cy="88" r="1.2"/><circle cx="980" cy="60" r="1.8"/>
    <circle cx="1060" cy="120" r="1.3"/><circle cx="900" cy="250" r="1.5"/><circle cx="1120" cy="210" r="1.4"/>
    <circle cx="560" cy="270" r="1.2"/><circle cx="1040" cy="272" r="1.6"/>
  </g>

  <!-- illuminated initial: a gilt-framed capital S on parchment -->
  <g transform="translate(72,70)">
    <circle cx="90" cy="90" r="120" fill="url(#halo)"/>
    <rect x="0" y="0" width="180" height="180" rx="18" fill="url(#parchment)" stroke="url(#gold)" stroke-width="6"/>
    <rect x="12" y="12" width="156" height="156" rx="10" fill="none" stroke="#c9962b" stroke-width="1.5" opacity="0.7"/>
    <!-- corner florets -->
    <g fill="#8a1f3d" opacity="0.85">
      <circle cx="26" cy="26" r="5"/><circle cx="154" cy="26" r="5"/>
      <circle cx="26" cy="154" r="5"/><circle cx="154" cy="154" r="5"/>
    </g>
    <text x="90" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="700"
          fill="#8a1f3d" text-anchor="middle" dominant-baseline="central">S</text>
  </g>

  <!-- wordmark + tagline -->
  <g transform="translate(300,0)">
    <text x="0" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700"
          letter-spacing="2" fill="url(#gold)">Scriptorium</text>
    <text x="4" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic"
          fill="#f3e6c4">Turn any book into an illuminated, offline library.</text>
    <text x="4" y="238" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21"
          fill="#c8bde8" letter-spacing="3">BAKED AT HOME&#160;&#160;&#183;&#160;&#160;READ ANYWHERE&#160;&#160;&#183;&#160;&#160;NO CLOUD</text>
  </g>
</svg>
